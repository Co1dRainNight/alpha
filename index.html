<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha-Perp 联动监控看板</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- 顶部加载进度条 -->
  <div id="loading-bar" class="loading-bar"></div>

  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-title">
      <span class="logo">⚡</span>
      <span>Alpha-Perp 联动监控</span>
      <span class="header-subtitle">研究型实时监控系统 v1.1</span>
    </div>
    <div class="header-actions">
      <span id="fetch-status" class="fetch-status" style="display:none"></span>
      <span id="data-source" class="source-tag source-live">LIVE</span>
      <span class="status-dot"></span>
      <span class="countdown-wrap">下次刷新 <span id="countdown" class="countdown">--:--</span></span>
      <button id="btn-refresh" class="btn-refresh" title="立即刷新">↻</button>
    </div>
  </header>

  <!-- 统计区 -->
  <div id="stats-bar" class="stats-bar"></div>

  <!-- 筛选栏 -->
  <div class="filter-bar">
    <input type="text" id="search-input" class="search-input" placeholder="搜索 Symbol...">

    <select id="signal-filter" class="filter-select">
      <option value="all">全部信号</option>
      <option value="spotFirst">现货先动</option>
      <option value="perpFollow">合约跟动</option>
      <option value="oiPileUp">OI提前堆仓</option>
      <option value="crowdedRisk">高拥挤风险</option>
      <option value="shortSqueeze">空头回补</option>
      <option value="watching">观察中</option>
    </select>

    <select id="sort-select" class="filter-select">
      <option value="score">按评分排序</option>
      <option value="change5m">按 5m 涨跌</option>
      <option value="change1h">按 1h 涨跌</option>
      <option value="volume">按 Volume Ratio</option>
      <option value="oi">按 OI 变化</option>
      <option value="symbol">按名称排序</option>
    </select>

    <button id="priority-toggle" class="btn-toggle">★ 只看重点</button>

    <button id="log-toggle" class="btn-log">📋 信号日志</button>
  </div>

  <!-- 主表格 -->
  <div class="table-container">
    <table class="main-table">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Alpha Price</th>
          <th>Perp Price</th>
          <th>5m Change</th>
          <th>1h Change</th>
          <th>Vol Ratio</th>
          <th>OI Change</th>
          <th>Funding</th>
          <th>Score</th>
          <th>Signals</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="11" class="empty-row">正在加载数据...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 详情侧边栏 -->
  <div id="overlay" class="overlay"></div>
  <div id="detail-panel" class="detail-panel">
    <button id="detail-close" class="detail-close">✕</button>
    <div id="detail-content"></div>
  </div>

  <!-- 信号日志面板 -->
  <div id="log-panel" class="log-panel">
    <div class="log-panel-header">信号日志 Signal Log</div>
    <div id="log-body"></div>
  </div>

  <!-- JS 模块加载顺序 -->
  <script src="js/config.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/binanceApi.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/signals.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
