<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha-Perp 联动监控看板</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="loading-bar" class="loading-bar"></div>

  <header class="header">
    <div class="header-title">
      <span class="logo">⚡</span>
      <span>Alpha-Perp 联动监控</span>
      <span class="header-subtitle">研究型监控 v2.0</span>
    </div>
    <div class="header-actions">
      <span id="fetch-status" class="fetch-status" style="display:none"></span>
      <span id="data-source" class="source-tag source-live">LIVE</span>
      <span class="status-dot"></span>
      <span class="countdown-wrap">下次刷新 <span id="countdown" class="countdown">--:--</span></span>
      <button id="btn-refresh" class="btn-refresh" title="立即刷新">↻</button>
    </div>
  </header>

  <div id="stats-bar" class="stats-bar"></div>

  <!-- 视图模式 -->
  <div id="view-mode-bar" class="view-mode-bar">
    <button class="vm-btn active" data-view="all">全部</button>
    <button class="vm-btn" data-view="active">活跃信号</button>
    <button class="vm-btn" data-view="priority">重点币</button>
    <button class="vm-btn" data-view="top20">Top 20</button>
    <button class="vm-btn" data-view="top50">Top 50</button>
    <button class="vm-btn vm-warn" data-view="dataWarn">数据异常</button>

    <div class="filter-right">
      <input type="text" id="search-input" class="search-input" placeholder="搜索 Symbol...">
      <select id="signal-filter" class="filter-select">
        <option value="all">全部信号</option>
        <option value="spotFirst">现货先动</option>
        <option value="perpFollow">合约跟动</option>
        <option value="oiPileUp">OI堆仓</option>
        <option value="crowdedRisk">高拥挤风险</option>
        <option value="shortSqueeze">空头回补</option>
        <option value="watching">观察中</option>
        <option value="dataInsufficient">数据不足</option>
      </select>
      <select id="sort-select" class="filter-select">
        <option value="score">按评分</option>
        <option value="change5m">按 5m</option>
        <option value="change1h">按 1h</option>
        <option value="volume">按 Volume</option>
        <option value="oi">按 OI</option>
        <option value="symbol">按名称</option>
      </select>
      <button id="log-toggle" class="btn-log">📋 日志</button>
    </div>
  </div>

  <!-- 主表 -->
  <div class="table-container">
    <table class="main-table">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>5M</th>
          <th>1H</th>
          <th>OI</th>
          <th>Funding</th>
          <th>Score</th>
          <th>Signal</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="8" class="empty-row">正在加载数据...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="overlay" class="overlay"></div>
  <div id="detail-panel" class="detail-panel">
    <button id="detail-close" class="detail-close">✕</button>
    <div id="detail-content"></div>
  </div>

  <div id="log-panel" class="log-panel">
    <div class="log-panel-header">
      <span>信号研究日志</span>
      <div class="log-filters">
        <input type="text" id="log-filter-symbol" class="log-filter-input" placeholder="Symbol...">
        <select id="log-filter-signal" class="log-filter-select">
          <option value="all">全部信号</option>
          <option value="spotFirst">现货先动</option>
          <option value="perpFollow">合约跟动</option>
          <option value="oiPileUp">OI堆仓</option>
          <option value="crowdedRisk">高拥挤</option>
          <option value="shortSqueeze">空头回补</option>
        </select>
      </div>
    </div>
    <div id="log-body"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/binanceApi.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/signals.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
